[project]
name = "named-api"
version = "0.1.0"
description = "Named backend API"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.14,<2",
    "asyncmy>=0.2.10,<1",
    "dashscope>=2.0.3",
    "email-validator>=2.3.0",
    "fastapi>=0.115,<1",
    "pillow>=13.0.0",
    "pydantic-ai-slim[openai]>=2.0,<3",
    "pydantic-settings>=2.7,<3",
    "python-multipart>=0.0.33",
    "sqlalchemy[asyncio]>=2.0.36,<3",
    "uvicorn[standard]>=0.34,<1",
]

[dependency-groups]
dev = [
    "aiosqlite>=0.22.1",
    "httpx>=0.28,<1",
    "pytest>=8.3,<9",
    "pytest-asyncio>=0.25,<1",
    "ruff>=0.9,<1",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
