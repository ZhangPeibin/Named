services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: named
      MYSQL_USER: named
      MYSQL_PASSWORD: named
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      DATABASE_URL: mysql+asyncmy://named:named@mysql:3306/named?charset=utf8mb4
      MEDIA_ROOT: /app/media
    ports:
      - "8000:8000"
    depends_on:
      mysql:
        condition: service_healthy
    command:
      - /bin/sh
      - -c
      - alembic upgrade head && uvicorn main:app --host 0.0.0.0 --port 8000 --app-dir src
    volumes:
      - media_data:/app/media
    restart: unless-stopped

volumes:
  mysql_data:
  media_data:
