services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: named
      MYSQL_USER: named
      MYSQL_PASSWORD: named
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  mysql_data:
