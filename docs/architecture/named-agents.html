<script>
  const stage = document.getElementById('stage');
  const canvas = document.getElementById('canvas');
  const svg = canvas.querySelector('svg');
  let scale = 1, x = 0, y = 0;
  let dragging = false, startX = 0, startY = 0, originX = 0, originY = 0;

  function apply() { canvas.style.transform = `translate(${x}px, ${y}px) scale(${scale})`; }
  function size() {
    const vb = svg.viewBox && svg.viewBox.baseVal;
    return { w: (vb && vb.width) || svg.width.baseVal.value || 2220, h: (vb && vb.height) || svg.height.baseVal.value || 5040 };
  }
  function fit() {
    const { w, h } = size();
    const pad = 40;
    scale = Math.min((window.innerWidth - pad * 2) / w, (window.innerHeight - pad * 2) / h, 1);
    x = (window.innerWidth - w * scale) / 2;
    y = (window.innerHeight - h * scale) / 2;
    apply();
  }
  function reset() { scale = 1; x = 0; y = 0; apply(); }
  function zoomAt(mx, my, next) {
    next = Math.min(4, Math.max(0.12, next));
    const k = next / scale;
    x = mx - (mx - x) * k;
    y = my - (my - y) * k;
    scale = next;
    apply();
  }
  stage.addEventListener('wheel', (e) => {
    e.preventDefault();
    const rect = stage.getBoundingClientRect();
    const next = scale * (e.deltaY < 0 ? 1.12 : 0.89);
    zoomAt(e.clientX - rect.left, e.clientY - rect.top, next);
  }, { passive: false });
  stage.addEventListener('pointerdown', (e) => {
    if (e.button !== 0) return;
    dragging = true;
    stage.classList.add('dragging');
    stage.setPointerCapture(e.pointerId);
    startX = e.clientX; startY = e.clientY; originX = x; originY = y;
  });
  stage.addEventListener('pointermove', (e) => {
    if (!dragging) return;
    x = originX + (e.clientX - startX);
    y = originY + (e.clientY - startY);
    apply();
  });
  function endDrag(e) {
    dragging = false;
    stage.classList.remove('dragging');
    try { stage.releasePointerCapture(e.pointerId); } catch (_) {}
  }
  stage.addEventListener('pointerup', endDrag);
  stage.addEventListener('pointercancel', endDrag);
  document.getElementById('fit').addEventListener('click', fit);
  document.getElementById('reset').addEventListener('click', reset);
  document.getElementById('zoomin').addEventListener('click', () => zoomAt(window.innerWidth / 2, window.innerHeight / 2, scale * 1.25));
  document.getElementById('zoomout').addEventListener('click', () => zoomAt(window.innerWidth / 2, window.innerHeight / 2, scale * 0.8));
  window.addEventListener('resize', fit);
  fit();
</script>
